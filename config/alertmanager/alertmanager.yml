global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'instance', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'ops-webhook'

receivers:
  - name: 'ops-webhook'
    webhook_configs:
      - url: 'http://172.28.0.1:5000/alerts'
        send_resolved: true